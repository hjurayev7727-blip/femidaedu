# Har bir PR va main'ga push: lint, turlar, testlar (PGlite — tashqi baza kerak emas), production build.
name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build uchun soxta ochiq qiymatlar (haqiqiy kalitlar CI'da kerak emas)
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx next build
